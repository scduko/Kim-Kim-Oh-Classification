# The full verification of lean/docs/STATUS.md on GitHub's runners, started by hand (Actions → Full
# verification → Run workflow). It builds everything, including the kernel checks of §4, audits
# the axioms of mainTheorem and replays every project module by exact name from its imports.
#
# A hosted job has at most 6 hours on 4 cores and 16 GB, so the work is chained: the light
# modules with QuadFormsKB, then the heavy modules in four parts of about equal cost
# (lean/scripts/full_build.py), each job passing the build on to the next as an artifact
# (.github/actions/prepare, .github/actions/save); then the axiom audit, and the replay in five
# parallel jobs. Within a job the heavy modules are built one at a time, since the largest needs
# about 9 GB. The whole run takes most of a day.
name: Full verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  LEAN_NUM_THREADS: 2

defaults:
  run:
    working-directory: lean

jobs:
  light:
    name: QuadFormsKB and the light modules
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check that each release module is assigned exactly once
        run: python3 scripts/full_build.py check
      - uses: ./.github/actions/prepare
      - name: Test exact module replay
        run: bash scripts/test_exact_replay.sh
      - name: Build the light modules
        run: lake build $(python3 scripts/full_build.py list 0)
      - name: Audit the axioms of the light theorems
        run: lake env lean scripts/CheckAxioms.lean
      - uses: ./.github/actions/save
        with:
          name: build-0

  checks-1:
    name: Kernel checks, part 1 of 4
    needs: light
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/prepare
        with:
          build: build-0
      - name: Build part 1, one module at a time
        run: python3 scripts/full_build.py build 1
      - uses: ./.github/actions/save
        with:
          name: build-1

  checks-2:
    name: Kernel checks, part 2 of 4
    needs: checks-1
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/prepare
        with:
          build: build-1
      - name: Build part 2, one module at a time
        run: python3 scripts/full_build.py build 2
      - uses: ./.github/actions/save
        with:
          name: build-2

  checks-3:
    name: Kernel checks, part 3 of 4
    needs: checks-2
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/prepare
        with:
          build: build-2
      - name: Build part 3, one module at a time
        run: python3 scripts/full_build.py build 3
      - uses: ./.github/actions/save
        with:
          name: build-3

  checks-4:
    name: Kernel checks, part 4 of 4
    needs: checks-3
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/prepare
        with:
          build: build-3
      - name: Build part 4, one module at a time
        run: python3 scripts/full_build.py build 4
      - uses: ./.github/actions/save
        with:
          name: build-4

  audit:
    name: Axioms of mainTheorem
    needs: checks-4
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/prepare
        with:
          build: build-4
      - name: Check that everything is built
        run: lake build
      - name: Audit the axioms of mainTheorem
        run: lake env lean scripts/CheckAxiomsMain.lean

  replay:
    name: Kernel replay, part ${{ matrix.part }}
    needs: checks-4
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/prepare
        with:
          build: build-4
      - name: Replay the modules assigned to part ${{ matrix.part }}
        run: python3 scripts/full_build.py replay ${{ matrix.part }}
