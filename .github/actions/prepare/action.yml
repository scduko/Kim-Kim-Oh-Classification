name: Prepare a job of the full verification
description: Free disk space, install Lean and Mathlib, and unpack the build of an earlier job.
inputs:
  build:
    description: The artifact holding the build to start from (none if empty).
    default: ''
runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - name: Install Lean and Mathlib
      uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
      with:
        lake-package-directory: lean
        auto-config: "false"
        build: "false"
        test: "false"
        lint: "false"
        use-github-cache: "false"
        use-mathlib-cache: "true"
    - name: Download the build
      if: inputs.build != ''
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.build }}
        path: ${{ github.workspace }}
    - name: Unpack the build
      if: inputs.build != ''
      shell: bash
      working-directory: ${{ github.workspace }}
      run: tar -C lean/.lake -I zstd -xf build.tar.zst && rm build.tar.zst
