name: Save the build for the next job of the full verification
description: Pack .lake/build and upload it as an artifact.
inputs:
  name:
    description: The name of the artifact.
    required: true
runs:
  using: composite
  steps:
    - name: Pack the build
      shell: bash
      working-directory: ${{ github.workspace }}
      run: tar -C lean/.lake -I 'zstd -T0 -3' -cf build.tar.zst build
    - name: Upload the build
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.name }}
        path: ${{ github.workspace }}/build.tar.zst
        retention-days: 3
        compression-level: 0
